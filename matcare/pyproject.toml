[project]
name = "matcare"
version = "0.1.0"
description = "MatCare — a test-driven RAG assistant for post-discharge maternity care"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.17.0",
    # PINNED, do not loosen. voyage-4-nano ships custom remote code whose model
    # class does not set `config_class`. transformers 5.x dereferences that field
    # in AutoModel.register() and dies with:
    #   AttributeError: 'NoneType' object has no attribute '__name__'
    # sentence-transformers 6.x hard-requires transformers>=5, so both are pinned.
    "sentence-transformers>=5,<6",
    "transformers>=4.51,<5",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.5.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "tqdm>=4.70.0",
    # Chat interface. A main dependency rather than an extra: `uv sync` removes
    # extras that are not requested, so teammates would silently lose the demo.
    "streamlit>=1.40",
]

[project.optional-dependencies]
kb   = ["trafilatura>=1.12", "pdfplumber>=0.11", "requests>=2.32"]

[project.scripts]
matcare = "matcare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcare"]
